<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="100%" height="100%">
  <defs>
    <!-- Device Outer Band (Silver/White Aluminum) -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e5e5ea"/>
      <stop offset="80%" stop-color="#d1d1d6"/>
      <stop offset="100%" stop-color="#aeaeb2"/>
    </linearGradient>

    <!-- Side Buttons Gradient (Polished Silver) -->
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7c7cc"/>
    </linearGradient>

    <!-- Screen Gradient (Silver Titanium iOS 18 Abstract Glow) -->
    <radialGradient id="screenGradient" cx="85%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#738294"/>
      <stop offset="60%" stop-color="#161a21"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Left Side Button (Power/Top Button in Portrait, Left in Landscape) -->
  <rect x="47" y="85" width="3" height="45" rx="1.5" fill="url(#buttonGradient)"/>

  <!-- Top Side Buttons (Volume) -->
  <rect x="90" y="47" width="45" height="3" rx="1.5" fill="url(#buttonGradient)"/>
  <rect x="145" y="47" width="45" height="3" rx="1.5" fill="url(#buttonGradient)"/>

  <!-- Main Outer Body (Silver flat edges) -->
  <!-- 4:3 Ratio scaled for 12.9-inch -->
  <rect x="50" y="50" width="800" height="575" rx="46" ry="46" fill="url(#bodyGradient)"/>

  <!-- Antenna Bands (Light Gray for Silver Model) -->
  <rect x="100" y="50" width="4" height="3" fill="#c7c7cc"/>
  <rect x="796" y="50" width="4" height="3" fill="#c7c7cc"/>
  <rect x="100" y="622" width="4" height="3" fill="#c7c7cc"/>
  <rect x="796" y="622" width="4" height="3" fill="#c7c7cc"/>
  <rect x="50" y="110" width="3" height="4" fill="#c7c7cc"/>
  <rect x="847" y="110" width="3" height="4" fill="#c7c7cc"/>

  <!-- Apple Pencil Magnetic Connector (Top Edge Center) -->
  <rect x="410" y="49" width="80" height="2" rx="1" fill="#c7c7cc"/>

  <!-- Inner Black Bezel (Uniform display border) -->
  <rect x="53" y="53" width="794" height="569" rx="43" ry="43" fill="#000000"/>

  <!-- Active Display Area (12.9-inch 4:3 aspect ratio) -->
  <rect x="75" y="75" width="750" height="525" rx="24" ry="24" fill="url(#screenGradient)"/>

  <!-- Landscape Camera Array & Face ID Sensors (Top Bezel) -->
  <!-- IR Sensor -->
  <circle cx="435" cy="64" r="3.5" fill="#050505"/>
  <circle cx="435" cy="64" r="1.5" fill="#151515"/>
  <!-- Front Facing Camera -->
  <circle cx="450" cy="64" r="5" fill="#080808"/>
  <circle cx="450" cy="64" r="2" fill="#1c1c24"/>
  <!-- Ambient Light Sensor -->
  <circle cx="462" cy="64" r="2.5" fill="#050505"/>
  <!-- Microphone -->
  <circle cx="472" cy="64" r="1.5" fill="#1c1c1e"/>

  <!-- Status Bar UI (iPadOS) -->
  <!-- Date (Top Left) -->
  <text x="105" y="101" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-opacity="0.8" text-anchor="start">Sun Oct 25</text>
  <!-- Time (Top Left) -->
  <text x="180" y="101" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-opacity="0.8" text-anchor="start">10:18 PM</text>

  <!-- Wi-Fi Icon (Top Right) -->
  <g transform="translate(745, 90)" opacity="0.8">
    <path d="M 0 5 Q 5.5 0.5 11 5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 2.5 8 Q 5.5 5.5 8.5 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="5.5" cy="11" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Battery Icon (Top Right) -->
  <g transform="translate(765, 89)" opacity="0.8">
    <rect x="0" y="0" width="22" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="2" y="2" width="14" height="7" rx="1.5" fill="#ffffff"/>
    <path d="M 23 3.5 A 1.5 1.5 0 0 1 23 7.5" fill="#ffffff"/>
  </g>

  <!-- iPadOS Lock Screen UI -->
  <!-- Tiny Top Padlock -->
  <g transform="translate(443, 115)" opacity="0.9">
    <path d="M 3 5 v -2.5 a 4 4 0 0 1 8 0 v 2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="5" width="14" height="9" rx="2" fill="#ffffff"/>
  </g>

  <!-- Large Lock Screen Date -->
  <text x="450" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">Sunday, October 25</text>

  <!-- Bold Lock Screen Time (iOS 18 Heavily Weighted Clock Font) -->
  <text x="450" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="-4" fill="#ffffff" text-anchor="middle">10:18</text>

  <!-- Swipe Up Indicator -->
  <text x="450" y="565" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.8">Swipe up to open</text>
  
  <!-- Home Indicator Bar -->
  <rect x="350" y="585" width="200" height="5" rx="2.5" fill="#ffffff"/>
</svg>