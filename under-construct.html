<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Under Construction | Jason Torres</title>
    <meta name="description" content="This page is under construction. Please check back soon." />
    <style>
      /* Start — Reset */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* End — Reset */

      /* Start — Tokens */
      :root {
        /* Background (matches styling/bd-style.css .page-body) */
        --color-bg-section: #fcfcfa;
        --dot: #ececec;

        /* Construction palette */
        --cone-yellow: #ffc61a;
        --cone-orange: #ff7a1a;
        --cone-black: #1a1a1a;

        /* Font stacks (system fallbacks only — no external files) */
        --font-heading: "Rubik", "Arial", sans-serif;
        --font-mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --font-body: "Google Sans Flex", "Helvetica Neue", Arial, sans-serif;
      }
      /* End — Tokens */

      /* Start — Base */
      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.6;
        color: var(--cone-black);
        background-color: var(--color-bg-section);
        background-image: radial-gradient(circle, var(--dot) 2px, transparent 2px);
        background-size: 24px 24px;
      }
      /* End — Base */

      /* Start — Hazard tape */
      .tape {
        flex: none;
        height: 28px;
        background: repeating-linear-gradient(-45deg, var(--cone-yellow) 0 24px, var(--cone-black) 24px 48px);
      }
      /* End — Hazard tape */

      /* Start — Main */
      .main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 60px 20px;
      }

      .sign {
        width: min(100%, 560px);
        background: var(--cone-yellow);
        border: 6px solid var(--cone-black);
        border-radius: 15px;
        padding: 40px 36px 36px;
        text-align: center;
        box-shadow: 0 12px 28px rgba(26, 26, 26, 0.18);
      }

      .crew {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 20px;
      }

      .crew svg {
        display: block;
        width: 96px;
        height: 96px;
        overflow: visible;
      }

      .sign__kicker {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: var(--cone-black);
        color: var(--cone-yellow);
        padding: 4px 12px;
        border-radius: 4px;
        margin-bottom: 16px;
      }

      .sign h1 {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 2.5rem;
        line-height: 1.15;
        margin-bottom: 16px;
      }

      .sign p {
        font-size: 1.0625rem;
        max-width: 42ch;
        margin: 0 auto;
      }

      .sign__btn {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 24px;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--cone-black);
        background: var(--cone-orange);
        border: 3px solid var(--cone-black);
        border-radius: 8px;
        text-decoration: none;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .sign__btn:hover,
      .sign__btn:focus-visible {
        background: var(--cone-black);
        color: var(--cone-yellow);
      }

      .sign__btn:focus-visible {
        outline: 3px solid var(--cone-orange);
        outline-offset: 3px;
      }
      /* End — Main */

      /* Start — Cone sway */
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }

      .sign__icon {
        transform-origin: 50% 90%;
        animation: sway 3s ease-in-out infinite;
      }
      /* End — Cone sway */

      /* Start — Crew animations */
      /* SVG parts pivot around points in the viewBox (e.g. a shoulder) */
      .worker__arm,
      .robot__arm,
      .robot__eye,
      .robot__light {
        transform-box: view-box;
      }

      /* Human worker: hammer swings down and strikes */
      @keyframes hammer {
        0%,
        100% {
          transform: rotate(-10deg);
        }
        45% {
          transform: rotate(55deg);
        }
        55% {
          transform: rotate(47deg);
        }
      }

      .worker__arm {
        transform-origin: 58px 46px;
        animation: hammer 1.2s ease-in infinite;
      }

      /* Robot worker: wrench ratchets back and forth */
      @keyframes ratchet {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(35deg);
        }
      }

      .robot__arm {
        transform-origin: 30px 52px;
        animation: ratchet 1.6s ease-in-out infinite;
      }

      /* Robot worker: eyes blink */
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }

      .robot__eye {
        transform-origin: 48px 29px;
        animation: blink 4s infinite;
      }

      /* Robot worker: antenna light pulses */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      .robot__light {
        animation: pulse 1s ease-in-out infinite;
      }
      /* End — Crew animations */

      @media (prefers-reduced-motion: reduce) {
        .sign__icon,
        .worker__arm,
        .robot__arm,
        .robot__eye,
        .robot__light {
          animation: none;
        }
        .sign__btn {
          transition: none;
        }
      }

      /* Start — Mobile */
      @media (max-width: 767px) {
        .main {
          padding: 40px 16px;
        }
        .sign {
          padding: 32px 20px 28px;
          border-width: 5px;
        }
        .sign h1 {
          font-size: 2rem;
        }
        .crew {
          gap: 8px;
        }
        .crew svg {
          width: 72px;
          height: 72px;
        }
        .tape {
          height: 20px;
        }
      }
      /* End — Mobile */
    </style>
  </head>
  <body>
    <div class="tape" aria-hidden="true"></div>

    <main class="main">
      <section class="sign" aria-labelledby="uc-title">
        <div class="crew" aria-hidden="true">
          <!-- Human worker -->
          <svg class="worker" viewBox="0 0 96 96" focusable="false">
            <!-- Legs + boots -->
            <rect x="36" y="66" width="8" height="20" fill="#1a1a1a" />
            <rect x="48" y="66" width="8" height="20" fill="#1a1a1a" />
            <rect x="33" y="84" width="12" height="6" rx="2" fill="#1a1a1a" />
            <rect x="47" y="84" width="12" height="6" rx="2" fill="#1a1a1a" />
            <!-- Resting arm -->
            <line x1="35" y1="47" x2="27" y2="64" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" />
            <!-- Safety vest -->
            <rect x="32" y="42" width="28" height="26" rx="6" fill="#ff7a1a" stroke="#1a1a1a" stroke-width="3" />
            <rect x="33.5" y="53" width="25" height="4" fill="#fcfcfa" />
            <!-- Head -->
            <circle cx="46" cy="31" r="10" fill="#d9a066" stroke="#1a1a1a" stroke-width="3" />
            <!-- Hard hat -->
            <path d="M35 27a11 11 0 0 1 22 0z" fill="#ffc61a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
            <rect x="31" y="25" width="30" height="5" rx="2.5" fill="#ffc61a" stroke="#1a1a1a" stroke-width="3" />
            <!-- Swinging arm + hammer -->
            <g class="worker__arm">
              <line x1="58" y1="46" x2="72" y2="38" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" />
              <line x1="72" y1="40" x2="72" y2="20" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" />
              <rect x="63" y="14" width="18" height="8" rx="2" fill="#1a1a1a" />
            </g>
          </svg>

          <!-- Traffic cone -->
          <svg class="sign__icon" viewBox="0 0 96 96" focusable="false">
            <rect x="10" y="80" width="76" height="10" rx="3" fill="#1a1a1a" />
            <path d="M40 8h16l22 72H18z" fill="#ff7a1a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
            <path d="M33 32h30l4 13H29z" fill="#fcfcfa" />
            <path d="M26 56h44l4 13H22z" fill="#fcfcfa" />
          </svg>

          <!-- Robot worker -->
          <svg class="robot" viewBox="0 0 96 96" focusable="false">
            <!-- Treads -->
            <rect x="26" y="78" width="44" height="12" rx="6" fill="#1a1a1a" />
            <circle cx="34" cy="84" r="3" fill="#ffc61a" />
            <circle cx="48" cy="84" r="3" fill="#ffc61a" />
            <circle cx="62" cy="84" r="3" fill="#ffc61a" />
            <!-- Resting arm -->
            <line x1="66" y1="52" x2="74" y2="66" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" />
            <!-- Body -->
            <rect x="30" y="46" width="36" height="32" rx="4" fill="#9aa3ad" stroke="#1a1a1a" stroke-width="3" />
            <rect x="37" y="60" width="22" height="8" fill="#ffc61a" />
            <!-- Neck + head -->
            <rect x="44" y="40" width="8" height="6" fill="#1a1a1a" />
            <rect x="32" y="18" width="32" height="22" rx="5" fill="#9aa3ad" stroke="#1a1a1a" stroke-width="3" />
            <g class="robot__eye">
              <circle cx="41" cy="29" r="4" fill="#ff7a1a" />
              <circle cx="55" cy="29" r="4" fill="#ff7a1a" />
            </g>
            <!-- Antenna -->
            <line x1="48" y1="18" x2="48" y2="9" stroke="#1a1a1a" stroke-width="3" />
            <circle class="robot__light" cx="48" cy="7" r="3.5" fill="#ff7a1a" />
            <!-- Working arm + wrench -->
            <g class="robot__arm">
              <line x1="30" y1="52" x2="18" y2="44" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" />
              <line x1="18" y1="44" x2="14" y2="30" stroke="#5b636b" stroke-width="4" stroke-linecap="round" />
              <path d="M9 26a6 6 0 1 0 10 -3" fill="none" stroke="#5b636b" stroke-width="4" stroke-linecap="round" />
            </g>
          </svg>
        </div>

        <span class="sign__kicker">Page build in progress</span>
        <h1 id="uc-title">Under construction</h1>
        <p>
          Thanks for stopping by. <br />
          I am currently developing this page. <br />
          Please check back soon!
        </p>

        <a class="sign__btn" href="https://jasontorresedd.com/"> &larr; Return to homepage </a>
      </section>
    </main>

    <div class="tape" aria-hidden="true"></div>
  </body>
</html>
